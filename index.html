<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電機島｜海洋大學電機系學程地圖</title>
<style>
:root{--bg:#07131f;--bg2:#0b2236;--ink:#e8f4ff;--mute:#8fb0c8;--pcb:#0f6b52;--pcb2:#0a4636;--gold:#f5c542;--cy:#38e1ff;--card:#0d2a40cc;--line:#1d4a6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#07131f}
*{box-sizing:inherit}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 0,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px;opacity:.18;pointer-events:none}
.sym{position:fixed;font-size:26px;color:var(--cy);opacity:.14;animation:fl 9s ease-in-out infinite;pointer-events:none;font-family:serif}
@keyframes fl{50%{transform:translateY(-22px) rotate(8deg)}}
header{text-align:center;padding:22px 16px 4px;position:relative}
h1{margin:0;font-size:clamp(24px,5vw,38px);letter-spacing:.12em}
h1 b{color:var(--gold);text-shadow:0 0 18px #f5c54288}
header p{margin:6px 0 0;color:var(--mute);font-size:14px}
.stage{position:relative;max-width:980px;margin:0 auto;height:clamp(380px,62vw,520px)}
.base{position:absolute;left:4%;right:4%;top:14%;bottom:2%;border-radius:46% 54% 50% 50%/55% 50% 50% 45%;
background:radial-gradient(circle at 50% 40%,#17906f,var(--pcb) 55%,var(--pcb2));transform:perspective(900px) rotateX(38deg);box-shadow:0 26px 0 #06281f,0 44px 50px #000a;overflow:hidden}
.base svg{position:absolute;inset:0;width:100%;height:100%}
.trace{stroke:#7fffd4;stroke-width:2;fill:none;opacity:.55;stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.chip{position:absolute;left:50%;top:46%;width:18%;height:26%;transform:translate(-50%,-50%);background:#101820;border:2px solid #3a4c5c;border-radius:6px;box-shadow:0 0 28px #38e1ff55}
.chip::after{content:"EE";position:absolute;inset:0;display:grid;place-items:center;color:var(--cy);font:700 clamp(12px,2.6vw,22px) monospace;letter-spacing:.1em}
.pin{position:absolute;pointer-events:none}
.who{position:absolute;transform:translate(-50%,-100%);background:none;border:0;color:var(--ink);cursor:pointer;text-align:center;font:inherit;transition:left .7s cubic-bezier(.5,1.6,.4,1),top .7s cubic-bezier(.5,1.6,.4,1);padding:0;-webkit-tap-highlight-color:transparent}
.who svg{width:clamp(44px,8vw,68px);display:block;margin:0 auto;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 6px 4px #0008)}
.who:nth-of-type(2n) svg{animation-delay:-.6s}
@keyframes bob{50%{transform:translateY(-6px)}}
.who span{display:inline-block;margin-top:2px;background:#0b1c2cd9;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.who.on span{background:var(--gold);color:#222;border-color:var(--gold)}
.who:hover svg,.who:focus-visible svg{transform:scale(1.12)}
.who:focus-visible{outline:2px solid var(--cy);outline-offset:4px;border-radius:12px}
#boss{left:50%;top:50%;z-index:3}
#boss svg{width:clamp(58px,10vw,90px)}
.bubble{position:absolute;left:50%;top:0;transform:translateX(-50%);width:min(92%,560px);background:#f4fbff;color:#10202e;border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.6;box-shadow:0 8px 24px #0007;z-index:5;min-height:3.4em}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-bottom:0;border-top-color:#f4fbff}
.bubble small{display:block;color:#3b6a8c;font-weight:700;margin-bottom:2px}
.panel{max-width:980px;margin:6px auto 0;padding:0 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(6px)}
.card h2{margin:0 0 10px;font-size:19px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.col h3{margin:0 0 8px;font-size:14px;color:var(--cy);letter-spacing:.1em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.c{padding:5px 11px;border-radius:9px;background:#12374f;border:1px solid var(--line);font-size:14px}
.c.e{background:#4a3a08;border-color:var(--gold);color:#ffe28a;box-shadow:0 0 10px #f5c54255}
.c.f{cursor:pointer;background:#0f4a45;border-color:#2dd4bf;font:inherit;font-size:14px;color:var(--ink)}
.c.f.on{background:var(--cy);color:#06202e}
.legend{font-size:12px;color:var(--mute);margin-top:10px}
.path{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:14px;font-size:13px;color:var(--mute)}
.path i{font-style:normal;color:var(--gold)}
#ext{margin-top:12px;display:none}
#ext h3{color:var(--gold)}
.hint{text-align:center;color:var(--mute);font-size:13px;margin:4px 0 0}
@media(max-width:560px){.bubble{font-size:13.5px;padding:10px 12px}.stage{height:460px}.base{top:22%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<span class="sym" style="left:6%;top:30%">Ω</span><span class="sym" style="left:90%;top:22%;animation-delay:-3s">⏚</span><span class="sym" style="left:12%;top:72%;animation-delay:-5s">∿</span><span class="sym" style="left:84%;top:68%;animation-delay:-2s">⏛</span>
<header>
<h1>⚡ <b>電機島</b> ・ 學程地圖</h1>
<p>國立臺灣海洋大學 電機工程學系 大學部　點選島上的同學，聽系主任介紹各年級課程</p>
</header>
<div class="stage" id="stage">
<div class="bubble" id="bub"></div>
<div class="base">
<svg viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true">
<path class="trace" d="M0 30H35M65 30H100M50 0V18M50 42V60M8 8L28 22H40M92 52L72 40H60M92 8L70 20M8 52L30 40"/>
<g fill="#c9a227"><circle cx="35" cy="30" r="1.3"/><circle cx="65" cy="30" r="1.3"/><circle cx="50" cy="18" r="1.3"/><circle cx="50" cy="42" r="1.3"/></g>
<rect x="18" y="12" width="6" height="2.6" fill="#222" stroke="#c9a227" stroke-width=".3"/><rect x="76" y="44" width="6" height="2.6" fill="#222" stroke="#c9a227" stroke-width=".3"/>
</svg>
<div class="chip"></div>
</div>
</div>
<p class="hint">👆 點選系主任或各年級同學</p>
<div class="panel">
<div class="card" id="card"></div>
</div>
<script>
const E=/電子學|電子電路|電工實驗|電路學/;
const G={
1:{c:"#4fc3f7",x:17,y:70,t:"大一：打地基",
 say:"大一是蓋地基的一年：微積分、普通物理、程式語言與計算機概論。下學期的電路學與交換電路與邏輯設計，是你第一次真正「接上電源」！",
 s:{"上學期":["計算機概論","計算機實習","普通物理","程式語言","普通物理實驗","微積分"],"下學期":["普通物理","普通物理實驗","微積分","工程數學","電路學","交換電路與邏輯設計"]}},
2:{c:"#81c784",x:83,y:70,t:"大二：電子學登場",
 say:"大二是電子學登場的一年！上學期電子學、電工實驗與電磁學同時開跑，下學期再加上電磁波、訊號與系統、機率學、資料結構與複變函數。",
 s:{"上學期":["工程數學","電磁學","線性代數","電路學","電子學","電工實驗"],"下學期":["電子學","電工實驗","電磁波","訊號與系統","機率學","資料結構","複變函數"]}},
3:{c:"#ffb74d",x:20,y:36,t:"大三：電子學進階與找方向",
 say:"電子學進入第三個學期，接著銜接電子電路。你還會修自動控制、電機機械、通訊工程與近代物理；下學期有「六選四（必選）」，為大四的專業領域做準備。",
 s:{"上學期":["電子學","電工實驗","近代物理","自動控制","電機機械","通訊工程"],"下學期":["電子電路","電工實驗","六選四（必選）"]}},
4:{c:"#ba68c8",x:80,y:36,t:"大四：專業領域",
 say:"大四除了電工實驗，要進入六大專業領域。點下面的領域，我帶你看看碩士班延伸的專業選修，提早知道往上可以學什麼！",
 s:{"大四":["電工實驗"]}}
};
const F={
"通訊與訊號處理":["時頻分析","無線通訊","通訊系統設計與模擬","適應訊號處理","信號偵測與估計","聲納訊號處理","數位通訊系統","行動通訊系統","數位訊號處理"],
"電力與電子電路":["電力電子學","電源供應器設計","電力電子積體電路設計","電力系統控制與穩定","電力系統動態分析","電力系統規劃與運轉","電力系統調度","保護電驛","電能系統分析實驗","太陽能光伏電子應用","作業研究","模糊系統"],
"控制":["適應控制","現代控制理論","切換控制系統","網路控制系統","多變數控制系統","非線性系統分析","矩陣理論與運用"],
"固態電子":["類比積體電路設計","超大型積體電路設計","超大型積體電路技術","電子設計自動化","光電元件","光電轉換導論","太陽能電池","化合物半導體工程元件","奈微米元件製程與模擬","微光機電感測工程","能量轉換元件特性分析與模擬"],
"電波":["電磁理論","導引波理論（一）","導引波理論（二）","微波電路設計","雷達技術","計算電磁學"],
"資訊科技":["軟體工程","圖形辨識","數位影像處理","類神經網路","軟性計算導論","高等嵌入式系統理論","數位系統塑模與合成","車用電子","生醫電子"]
};
const FS={"通訊與訊號處理":"讓訊號傳得遠、聽得清。","電力與電子電路":"從電源轉換到電力系統。","控制":"讓系統穩定、聰明地運作。","固態電子":"從元件、積體電路到光電。","電波":"微波、天線與電磁理論。","資訊科技":"軟硬整合、影像與智慧運算。"};
const CARE="跨領域「智慧照護」：設計概論、電資醫學概論、健康照護醫療應用專題、智慧體溫血壓照護";
function fig(c,boss){return `<svg viewBox="0 0 40 62" aria-hidden="true"><ellipse cx="20" cy="59" rx="12" ry="3" fill="#0006"/><rect x="12" y="44" width="6" height="14" rx="3" fill="#2b3a55"/><rect x="22" y="44" width="6" height="14" rx="3" fill="#2b3a55"/><rect x="9" y="25" width="22" height="22" rx="8" fill="${c}"/>${boss?'<path d="M20 26l-3 6 3 12 3-12z" fill="#c62828"/><rect x="26" y="30" width="9" height="6" rx="1" fill="#101820" stroke="#38e1ff" stroke-width="1"/>':'<rect x="7" y="29" width="5" height="13" rx="2.5" fill="#00000030"/>'}<circle cx="20" cy="14" r="10" fill="#ffd9b3"/><path d="M10 13a10 10 0 0 1 20 0c-4-4-14-6-20 0z" fill="${boss?'#cfd8dc':'#3b2a20'}"/><circle cx="16.5" cy="15" r="1.4" fill="#222"/><circle cx="23.5" cy="15" r="1.4" fill="#222"/>${boss?'<g fill="none" stroke="#222" stroke-width="1"><circle cx="16.5" cy="15" r="3.2"/><circle cx="23.5" cy="15" r="3.2"/></g>':''}<path d="M17 19q3 2.5 6 0" stroke="#a0522d" stroke-width="1.2" fill="none"/></svg>`}
const st=document.getElementById("stage"),bub=document.getElementById("bub"),card=document.getElementById("card");
let tm;
function say(who,txt){clearTimeout(tm);bub.innerHTML=`<small>${who}</small><span></span>`;const sp=bub.lastChild;let i=0;(function n(){sp.textContent=txt.slice(0,++i);if(i<txt.length)tm=setTimeout(n,22)})()}
const btn=(id,html,x,y,lab,cls)=>{const b=document.createElement("button");b.className="who";b.id=id;b.style.left=x+"%";b.style.top=y+"%";b.setAttribute("aria-label",lab);b.innerHTML=html;st.appendChild(b);return b};
const boss=btn("boss",fig("#eceff1",1)+"<span>系主任</span>",50,56,"系主任");
boss.onclick=()=>home();
const ws={};
for(const k in G){const g=G[k];ws[k]=btn("g"+k,fig(g.c)+`<span>大${"一二三四"[k-1]}</span>`,g.x,g.y,g.t);ws[k].onclick=()=>pick(k)}
function chips(a){return a.map(n=>`<span class="c${E.test(n)?" e":""}">${E.test(n)?"⚡ ":""}${n}</span>`).join("")}
function home(){
 Object.values(ws).forEach(w=>{w.classList.remove("on")});
 for(const k in G){ws[k].style.left=G[k].x+"%";ws[k].style.top=G[k].y+"%"}
 say("系主任","歡迎來到電機島！電子學是這座島的電力來源：大二起連修電子學，大三再銜接電子電路。點一點島上的同學，我帶你逛各年級的課程！");
 card.innerHTML=`<h2>🏝️ 四年學程總覽</h2><div class="cols">${Object.keys(G).map(k=>`<div class="col"><h3>${G[k].t}</h3><div class="chips">${chips(Object.values(G[k].s).flat().filter((v,i,a)=>a.indexOf(v)==i))}</div></div>`).join("")}</div><div class="path">⚡ 電子學之路：<span class="c e">大二上 電子學</span><i>→</i><span class="c e">大二下 電子學</span><i>→</i><span class="c e">大三上 電子學</span><i>→</i><span class="c e">大三下 電子電路</span></div><p class="legend">⚡ 金色標示為電子學與電路相關核心課程。課程依系上「必修與核心課程關聯圖」整理。</p>`;
}
function pick(k){
 const g=G[k];
 for(const j in ws){ws[j].classList.toggle("on",j==k);ws[j].style.left=G[j].x+"%";ws[j].style.top=G[j].y+"%"}
 ws[k].style.left=(g.x+(50-g.x)*.4)+"%";ws[k].style.top=(g.y+(56-g.y)*.35)+"%";
 say("系主任",g.say);
 let h=`<h2>${["📘","📗","📙","📕"][k-1]} ${g.t}</h2><div class="cols">${Object.entries(g.s).map(([s,a])=>`<div class="col"><h3>${s}</h3><div class="chips">${chips(a)}</div></div>`).join("")}</div>`;
 if(k==4){h+=`<div class="col" style="margin-top:14px"><h3>六大專業領域（點選查看延伸課程）</h3><div class="chips">${Object.keys(F).map(f=>`<button class="c f" data-f="${f}">${f}</button>`).join("")}</div></div><div id="ext" class="card"></div>`}
 if(k==3)h+=`<p class="legend">電子學連續三個學期（大二上、大二下、大三上），大三下接電子電路。</p>`;
 card.innerHTML=h;
 card.querySelectorAll(".f").forEach(b=>b.onclick=()=>field(b));
 card.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"nearest"});
}
function field(b){
 card.querySelectorAll(".f").forEach(x=>x.classList.toggle("on",x==b));
 const f=b.dataset.f,e=document.getElementById("ext");
 e.style.display="block";
 e.innerHTML=`<h3>${f}領域・碩士班專業選修</h3><p style="margin:0 0 8px;color:var(--mute);font-size:14px">${FS[f]}</p><div class="chips">${chips(F[f])}</div><p class="legend">${CARE}</p>`;
 say("系主任",`${f}領域：${FS[f]}想深入的話，碩士班還有這些專業選修可以接續。`);
}
home();
</script>
</body>
</html>
